<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Gestion des votes — Console Investigateur</title>
<link rel="icon" type="image/png" href="/favicon-96.png">
<link rel="stylesheet" href="/assets/page.css">
<style>
  .login { border: 2px solid #111; padding: 14px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 8px; }
  .login input { font: inherit; padding: 8px 10px; border: 2px solid #111; flex: 1 1 240px; }
  .btn { background: #111; color: var(--accent-green); border: 2px solid var(--accent-green); padding: 7px 12px; font-weight: bold; cursor: pointer; }
  .btn:hover { background: var(--accent-green); color: #111; }
  .btn.del { border-color: var(--danger-red); color: var(--danger-red); background: #fff; }
  .row { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #ddd; }
  .row .t { font-size: .9rem; font-weight: bold; line-height: 1.3; }
  .row input { width: 64px; padding: 6px; border: 2px solid #111; font: inherit; }
  #status { min-height: 1.3em; font-weight: bold; margin-bottom: 10px; }
  .hidden { display: none !important; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr 1fr; } .row .t { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="container" style="max-width:900px">
  <header><a href="/"><img src="/logo_chat_loupe.png" alt=""><h1>Gestion des votes<br><span class="slogan">Le Top des Éveillés</span></h1></a></header>
  <div class="content">
    <div id="status" role="status"></div>
    <form class="login" id="login">
      <input type="password" id="token" placeholder="Mot de passe de modération (COMMENTS_ADMIN_TOKEN)" autocomplete="current-password" required>
      <button class="btn" type="submit">🔓 Se connecter</button>
    </form>
    <div id="panel" class="hidden">
      <p>Modifie les totaux puis clique sur « Enregistrer ». « ↺ 0 » remet l'enquête à zéro et permet à tout le monde de revoter.</p>
      <div id="list"></div>
    </div>
  </div>
  <div class="back-bar"><a class="back-link" href="/">← Retour au blog</a> <a class="back-link" href="/outils/moderation.html" style="margin-left:8px">💬 Modération</a></div>
</div>
<script src="/assets/comments-config.js"></script>
<script>
const API = (window.COMMENTS_API || '').replace(/\/+$/, '');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token = ''; try { token = sessionStorage.getItem('mod_token') || ''; } catch (e) {}
const setStatus = (t, err) => { $('status').textContent = t; $('status').style.color = err ? '#a31515' : '#3d6b00'; };

async function setVotes(page, up, down) {
  const r = await fetch(API + '/admin/votes/set', { method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ page, up, down }) });
  if (r.status === 401) { token = ''; try { sessionStorage.removeItem('mod_token'); } catch (e) {} throw new Error('Mot de passe incorrect.'); }
  if (!r.ok) throw new Error('Erreur HTTP ' + r.status);
}

async function load() {
  const list = await (await fetch('/articles.json?v=' + Date.now())).json();
  list.sort((a, b) => String(b.published || '').localeCompare(String(a.published || '')));
  const { votes } = await (await fetch(API + '/votes?pages=' + encodeURIComponent(list.map(a => a.id).join(',')))).json();
  $('list').innerHTML = list.map(a => {
    const v = votes[a.id] || { up: 0, down: 0 };
    return '<div class="row" data-id="' + esc(a.id) + '"><span class="t">' + esc(a.title.slice(0, 90)) + '</span>' +
      '<label>👍 <input type="number" min="0" class="up" value="' + v.up + '"></label>' +
      '<label>👎 <input type="number" min="0" class="down" value="' + v.down + '"></label>' +
      '<button class="btn save">Enregistrer</button><button class="btn del zero">↺ 0</button></div>';
  }).join('');
}

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const row = b.closest('.row'); const page = row.dataset.id;
  let up = parseInt(row.querySelector('.up').value, 10), down = parseInt(row.querySelector('.down').value, 10);
  if (b.classList.contains('zero')) { if (!confirm('Remettre les votes de cette enquête à zéro ?')) return; up = 0; down = 0; }
  if (!(up >= 0 && down >= 0)) { setStatus('Saisis des nombres valides (≥ 0).', true); return; }
  try { await setVotes(page, up, down); setStatus('✅ Votes enregistrés (👍 ' + up + ' / 👎 ' + down + ').'); load(); }
  catch (err) { setStatus(err.message, true); if (!token) { $('panel').classList.add('hidden'); $('login').classList.remove('hidden'); } }
});

$('login').addEventListener('submit', async e => {
  e.preventDefault(); token = $('token').value.trim();
  const r = await fetch(API + '/admin/comments?status=pending', { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) { setStatus('Mot de passe incorrect.', true); return; }
  try { sessionStorage.setItem('mod_token', token); } catch (e) {}
  start();
});
function start() { $('login').classList.add('hidden'); $('panel').classList.remove('hidden'); setStatus(''); load().catch(() => setStatus('Impossible de charger les votes.', true)); }

if (!API) { setStatus('Service non déployé (assets/comments-config.js vide).', true); $('login').classList.add('hidden'); }
else if (token) start();
</script>
</body>
</html>
