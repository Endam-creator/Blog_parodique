# Configuration Pages CMS — https://app.pagescms.org
# Une enquête = un fichier content/enquetes/<id>.json.
# À chaque enregistrement, la GitHub Action reconstruit articles.json (lu par le site)
# puis régénère pages, RSS, sitemap, images WebP et aperçus de partage.

media:
  input: images
  output: /images
  categories: [image]
  extensions: [jpg, jpeg, png, webp]
  rename: safe

content:
  - name: enquetes
    label: 🕵️ Enquêtes
    type: collection
    path: content/enquetes
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [title, rubrique, published, brouillon]
      primary: title
      sort: published
      order: desc
    fields:
      - name: id
        label: Identifiant (généré automatiquement, ne pas modifier)
        type: uuid
        required: true
        options:
          editable: false
          generate: false

      - name: brouillon
        label: ✏️ Brouillon (cochée = invisible sur le site)
        type: boolean
        default: false

      - name: published
        label: Date de publication (une date future programme la mise en ligne ce jour-là, vers 7 h)
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: rubrique
        label: Rubrique (pour ajouter une rubrique, la déclarer aussi dans rubriques.json)
        type: select
        required: true
        options:
          values:
            - { value: complots-etat, label: "🏛️ Complots d'État" }
            - { value: technologies, label: "📡 Technologies suspectes" }
            - { value: paranormal, label: "🔮 Phénomènes paranormaux" }
            - { value: stars-sport, label: "🎤 Stars & sport truqués" }
            - { value: science, label: "🧪 Science alternative" }

      - name: title
        label: Titre de l'enquête
        type: string
        required: true

      - name: desc
        label: Résumé court (fil d'actualités + aperçus de partage, 1-2 phrases)
        type: text
        required: true

      - name: img
        label: Image d'illustration (laisser vide pour la faire générer par l'IA à partir de la description ci-dessous)
        type: image
        options:
          rename: safe

      - name: img_prompt
        label: 🎨 Description de l'image à générer par l'IA (scène, personnage, décor, détails drôles)
        type: text

      - name: img_regen
        label: 🔄 Régénérer l'image avec la description ci-dessus (remplace l'image actuelle)
        type: boolean
        default: false

      - name: classified
        label: Tampon CLASSIFIED
        type: boolean
        default: false

      - name: location
        label: Localisation
        type: string

      - name: author
        label: Auteur
        type: string
        default: L'Investigateur Anonyme

      - name: date
        label: Date affichée (facultatif — vide = calculée depuis la date de publication)
        type: string
        default: ""

      - name: intro
        label: Chapô / introduction
        type: text
        required: true

      - name: interview
        label: Interview exclusive
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "Q{index} — {q}"
        fields:
          - name: q
            label: Question
            type: text
          - name: a
            label: Réponse
            type: text

      - name: notice
        label: ⚠️ L'avis de la Rédaction
        type: text
