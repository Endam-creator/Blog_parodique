name: Validation et génération du site

on:
  push:
    branches: [main, master]
    paths:
      - 'articles.json'
      - 'index.html'
      - '.github/scripts/generate_feed.mjs'
      - '.github/scripts/generate_pages.mjs'
      - '.github/scripts/generate_images.mjs'
      - 'images/**'
      - '!images/og/**'
      - '!images/webp/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ÉTAPE 1 : validation de articles.json
      # Si le JSON est invalide (virgule en trop, guillemet oublié...),
      # l'action échoue → email d'alerte GitHub, et on sait immédiatement quoi corriger.
      - name: Validation de articles.json
        run: |
          node -e "
            const data = JSON.parse(require('fs').readFileSync('articles.json', 'utf8'));
            if (!Array.isArray(data)) throw new Error('articles.json doit contenir un tableau []');
            data.forEach((a, i) => {
              for (const champ of ['id', 'title', 'desc', 'intro']) {
                if (!a[champ]) throw new Error('Article #' + (i+1) + ' : champ manquant ou vide -> ' + champ);
              }
            });
            const ids = data.map(a => a.id);
            if (new Set(ids).size !== ids.length) throw new Error('Des articles ont le même id !');
            console.log('✅ articles.json valide (' + data.length + ' article(s))');
          "

      # ÉTAPE 2 : génération du flux RSS, du sitemap et des pages d'articles
      - name: Génération de feed.xml et sitemap.xml
        run: node .github/scripts/generate_feed.mjs

      - name: Génération des images WebP et des aperçus de partage tamponnés « PARODIE »
        run: |
          npm install --no-save --no-package-lock --silent sharp@0.34
          node .github/scripts/generate_images.mjs

      - name: Génération des pages HTML d'articles
        run: node .github/scripts/generate_pages.mjs

      # ÉTAPE 3 : commit automatique des fichiers générés
      - name: Commit des fichiers générés
        run: |
          git config user.name "L'Investigateur Automatique"
          git config user.email "actions@github.com"
          git add feed.xml sitemap.xml articles/ images/og/ images/webp/
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "🤖 Régénération auto : RSS, sitemap et pages d'articles"
            git push
          fi

      # ÉTAPE 4 : signalement IndexNow (Bing, Yandex, Seznam, Naver…)
      # On attend que GitHub Pages ait publié, puis on signale l'accueil,
      # le flux RSS et les pages des articles nouveaux ou modifiés.
      - name: Signalement IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          sleep 90
          git fetch -q --depth=1 origin "$BEFORE" 2>/dev/null || true
          git show "$BEFORE:articles.json" > /tmp/avant.json 2>/dev/null || echo "[]" > /tmp/avant.json
          node -e "
            const fs = require('fs');
            const HOST = 'les-verites-cachees.endam-digital.com';
            const KEY = '79ed8a00dddc9ba376be8dc93cd5408c';
            const avant = JSON.parse(fs.readFileSync('/tmp/avant.json', 'utf8') || '[]');
            const apres = JSON.parse(fs.readFileSync('articles.json', 'utf8'));
            const ancien = new Map(avant.map(a => [a.id, JSON.stringify(a)]));
            const changes = apres.filter(a => ancien.get(a.id) !== JSON.stringify(a)).map(a => a.id);
            const urls = ['https://' + HOST + '/', 'https://' + HOST + '/feed.xml']
              .concat(changes.map(id => 'https://' + HOST + '/articles/' + encodeURIComponent(id) + '.html'));
            console.log('URLs signalées :\n' + urls.join('\n'));
            fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify({ host: HOST, key: KEY, keyLocation: 'https://' + HOST + '/' + KEY + '.txt', urlList: urls })
            }).then(r => console.log('Réponse IndexNow : HTTP ' + r.status + ' (200 ou 202 = OK)'))
              .catch(e => console.log('IndexNow injoignable : ' + e.message));
          "
